[project]
name = "tessera"
version = "0.1.0"
description = "Local corpus of YouTube videos and transcripts. Nothing leaves the machine but `tessera ui`'s video playback."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "youtube-transcript-api>=1.2",
]

[project.scripts]
tessera = "tessera.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tessera"]